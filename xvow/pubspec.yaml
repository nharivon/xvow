name: xvow
description: "XVow — Make a vow. Keep it. Level up."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.3.2
  riverpod_annotation: ^4.0.3

  # Navigation
  go_router: ^14.2.0

  # Backend
  supabase_flutter: ^2.5.6

  # Push notifications
  firebase_core: ^3.4.0
  firebase_messaging: ^15.1.1

  # Env config
  flutter_dotenv: ^5.1.0

  # Local notifications (Step 25, but adding early)
  flutter_local_notifications: ^17.2.2

  # Utilities
  intl: ^0.19.0
  equatable: ^2.0.5
  uuid: ^4.4.0

  cupertino_icons: ^1.0.6
  drift: ^2.34.2
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.3
  path: ^1.9.0
  connectivity_plus: ^6.0.3
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  riverpod_generator: ^4.0.4
  build_runner: ^2.4.11
  mocktail: ^1.0.3
  drift_dev: ^2.34.0

flutter:
  uses-material-design: true
  assets:
    - .env